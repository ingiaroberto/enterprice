name: Container Security

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        service: [OrderService, CatalogService]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/docker/${{ matrix.service }}.Dockerfile -t enterprise-${{ matrix.service }}:${{ github.sha }} .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: enterprise-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
