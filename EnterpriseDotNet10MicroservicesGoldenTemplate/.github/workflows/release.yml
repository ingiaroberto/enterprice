name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore RIDA.Enterprise.sln
      - name: Build
        run: dotnet build RIDA.Enterprise.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test RIDA.Enterprise.sln --configuration Release --no-build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
