name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      connection_string:
        description: 'Non-production ORDER_TEST_CONNECTION_STRING supplied through an approved secret/environment'
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore RIDA.Enterprise.sln
      - run: dotnet build RIDA.Enterprise.sln -c Release --no-restore
      - name: Run integration tests
        env:
          ORDER_TEST_CONNECTION_STRING: ${{ secrets.ORDER_TEST_CONNECTION_STRING }}
        run: dotnet test RIDA.Enterprise.sln -c Release --no-build
